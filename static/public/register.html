<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
		<title>注册页面</title>
	</head>
	<body>
		<h3>注册页面</h3>
		<form>
			用户名/推荐邮箱：<input type="text" id="username" placeholder="请输入用户名"><br>
			邮箱号：<input type="text" id="email" placeholder="请输入邮箱号"><br>
			<div class="code-box">验证码：
					<input type="text" id="code" placeholder="请输入6位验证码">
					<input type="button" id="getCode" value="获取验证码">
				   </div>
			密码：<input type="password" id="psw"><br>
			验证密码：<input type="password" id="repwd" placeholder="请再次输入密码"><br>
			<input type="submit" value="提交"> 
			<input type="button" value="返回登录" onclick="location.href='login.html'"> 
	<script src="register.js"></script>
	</body>
</html>
