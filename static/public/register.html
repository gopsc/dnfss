<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
		<title>注册</title>
		<link rel="stylesheet" href="css/theme.css">
		<link rel="stylesheet" href="css/auth.css">
	</head>
	<body>
		<div class="card">
			<p class="auth-eyebrow">DNFS 树状笔记</p>
			<h2>注册页面</h2>
			<form id="form">
				<div>
				<label>邮箱号：</label>
					<input type="email" id="regemail" placeholder="请输入邮箱号">
					<span id="emlTip"></span>
				<div class="code-box">图形验证码：
					<input type="text" id="captchaAnswer" placeholder="请输入图形验证码" maxlength="4" autocomplete="off">
					<img id="captchaImg" class="captcha-img" alt="加载中…" title="点击刷新验证码">
					<span id="captchaTip"></span>
				</div>
				<div class="code-box">邮箱验证码：
						<input type="text" id="code" placeholder="请输入6位验证码" inputmode="numeric" maxlength="6">
						<input type="button" id="getCode" value="获取验证码">
						<span id="codeTip"></span>
					</div>
					<label>密码：</label>
					<input type="password" id="regpsw" placeholder="密码至少6位">
					<label>验证密码：</label>
					<input type="password" id="repwd" placeholder="请再次输入密码">
					<span id="pwdTip"></span>
				</div>
				<div class="form-actions">
					<input id="formsub" type="submit" value="提交"> 
					<input id="resetUser" type="reset" value="重置">
					<input type="button" value="返回登录" onclick="location.href='login.html'"> 
				</div>
			</form>
		</div>
		<footer class="footer">
			<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2024107064号-2</a>
		</footer>
		<script src="js/validation.js"></script>
		<script src="js/register.js?v=7"></script>
	</body>
</html>
