<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
		<title>注册</title>
		<link rel="stylesheet" href="css/theme.css">
	</head>
	<body>
		<div class="card">
			<h2>注册页面</h2>
			<form id="form">
				<div>
					<label>用户名/推荐邮箱：</label>
					<input type="text" id="regusername" placeholder="请输入用户名">
					<span id="msgTip" ></span>
					<label>邮箱号：</label>
					<input type="email" id="regemail" placeholder="请输入邮箱号">
					<div class="code-box">验证码：
						<input type="text" id="code" placeholder="请输入6位验证码" inputmode="numeric" maxlength="6">
						<input type="button" id="getCode" value="获取验证码">
						<span id="codeTip"></span>
					</div>
					<span id="emlTip"></span>
					<label>密码：</label>
					<input type="password" id="regpsw" placeholder="密码至少6位">
					<label>验证密码：</label>
					<input type="password" id="repwd" placeholder="请再次输入密码">
					<span id="pwdTip"></span>
				</div>
				<div class="form-actions">
					<input id="formsub" type="submit" value="提交"> 
					<input id="resetUser" type="reset" value="重置">
					<input type="button" value="返回登录" onclick="location.href='login.html'"> 
				</div>
			</form>
		</div>
		<footer class="footer">
			<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2024107064号-2</a>
		</footer>
		<script src="js/validation.js"></script>
		<script src="js/register.js?v=6"></script>
	</body>
</html>
