<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
		<title>登录</title>
		<link rel="stylesheet" href="css/theme.css">
	</head>
	<body>
		<div class="card">
			<h2>用户登录</h2>
			<form id="form" novalidate>
				<div>
					<label>邮箱：</label>
					<input type="text" id="loginUsername" placeholder="请输入邮箱">
					<span id="msgTip"></span>
					<label>密码：</label>
					<input type="password" id="loginPassword" placeholder="请输入密码">
					<span id="pwdTip"></span>
					<label>验证码：</label>
					<img id="captchaImg" alt="加载中…" title="点击刷新验证码" style="width:120px;height:38px;vertical-align:middle;cursor:pointer;margin-right:8px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box">
					<input type="text" id="captchaAnswer" placeholder="请输入验证码" maxlength="4" autocomplete="off" style="width:110px">
					<span id="captchaTip"></span>
				</div>
				<div class="form-actions">
					<button type="button" id="registerBtn">注册</button>
					<input type="submit" id="loginBtn" value="登录">
					<input type="reset" id="resetUser" value="重置">
				</div>
				<div class="form-check">
					<input type="checkbox" id="agreeBox" name="agree" value="access">
					<label id="agreement">同意该系统相关用户使用条例</label>
					<span id="agreeTip"></span>
				</div>
			</form>
			<a href="forgot.html" style="display:block;text-align:center;color:#999;font-size:13px;margin:8px 0">忘记密码？</a>
			<div style="text-align:center;margin:12px 0;position:relative"><div style="position:absolute;top:50%;left:0;right:0;height:1px;background:#e0d6cc"></div><span style="background:#fff;padding:0 12px;position:relative;color:#999;font-size:13px">或</span></div>
			<a href="https://yhdet.top/yhdet_auth?callback=https://qsont.me/yhdet_callback" class="yhdet-login-btn">开源社区 快捷登录</a>
			<style>.yhdet-login-btn{display:block;width:100%;padding:12px;border:1.5px solid #1a73e8;border-radius:8px;background:white;color:#1a73e8;font-size:15px;font-weight:600;text-decoration:none;text-align:center;box-sizing:border-box;margin-bottom:12px}.yhdet-login-btn:hover{background:#e8f0fe}</style>
		</div>
		<footer class="footer">
			<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2024107064号-2</a>
		</footer>
		<script src="js/validation.js"></script>
		<script src="js/login.js"></script>
	</body>
</html>
