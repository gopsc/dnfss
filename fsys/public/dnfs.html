<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<!-- 移动端适配核心标签 -->
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
		<title>树状笔记</title>
		<link rel="stylesheet" href="css/theme.css">
		<link rel="stylesheet" href="css/codeblock.css">
		<link rel="stylesheet" href="css/dnfs.css">
	</head>
	<body>
		<div class="box">
			<div id="searchbox" class="searchbox">
				<svg class="searchbox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="11" cy="11" r="7"/>
					<line x1="21" y1="21" x2="16.65" y2="16.65"/>
				</svg>
				<input type="text" placeholder="在当前节点内搜索..." id="searchtext" class="searchbox-input" autocomplete="off">
				<button type="button" id="searchsubmit" class="searchbox-btn" aria-label="搜索">搜索</button>
			</div>
			<div id="userpanel" class="userpanel"></div>
			<div id="minimap" class="minimap"></div>
			<div id="movebar" class="movebar"></div>
			<div class="recommend-list" id="recommend-list"></div>
			<div class="card node-form">
				<h3>节点操作</h3>
			<label>新增节点</label><input id="input-note-title">
			<!-- 特殊节点面板：登录用户可见（dnfs.js 按 /whoami login 显示；发布权限由后端按节点拥有者/管理员强制） -->
			<div id="sp-panel" style="display:none">
				<label>节点类型</label>
				<select id="sp-type">
					<option value="text">普通文本</option>
					<option value="js">前端代码（可审计/可运行）</option>
					<option value="file">文件（可下载）</option>
					<option value="style">界面样式（CSS 注入，控制整个界面）</option>
					<option value="theme">主题变量（换肤，仅 CSS 变量）</option>
				</select>
				<input type="file" id="sp-file" style="display:none">
				<span id="sp-file-tip"></span>
			</div>
			<label>节点内容</label><textarea id="input-note-content"></textarea>
				<div class="form-actions">
					<button id="input-note-submit">提交</button>
					<button id="input-note-clear">重置</button>
					<button id="delete-note" style="display:none">删除当前节点</button>
				</div>
			</div>
			<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.0/markdown-it.min.js"></script> -->
			<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script> -->
			<script src="js/highlight_11_9_0.js"></script>
			<script src="js/markdown-it-12_0_0.js"></script>
			<script src="js/validation.js"></script>
			<script src="js/token_manager.js"></script>
			<script src="js/dnfs.js"></script>
		</div>
		<footer class="footer">
			<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2024107064号-2</a>
		</footer>
	</body>
</html>
