[Server]
# v0.9.0：认证独立化（waf → ca → gateway 前置拓扑）
# gateway 退化为纯转发服务，仅 loopback 监听（启动强制自检，非 loopback 拒绝启动）：
#   - 8443 由 ca 接管（WAF upstream 不变），gateway 退居 8445
#   - 认证/验签/限流/WS 代理鉴权已全部迁至 ca（confs/configs/ca.ini）
#   - tls = off  启用 HTTP 模式（ca 前置后的内部链路）
address = 127.0.0.1
port = 8445
tls = off

[Proxy]
default = http://127.0.0.1:9200
closed  = http://127.0.0.1:8005;http://127.0.0.1:8007;
opened  = http://127.0.0.1:9200;http://127.0.0.1:8006;http://127.0.0.1:5200;

[Downstream]
# 日志推送端点（db pymsg 服务）
# 环境变量可覆盖：DB_HOST/DB_PORT, CONFS_HOST/CONFS_PORT
db_host = 127.0.0.1
db_port = 8005
